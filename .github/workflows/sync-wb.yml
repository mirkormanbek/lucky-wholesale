name: Sync and build wholesale catalog

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "config/**"
      - "catalog/**"
      - "public/**"
      - "index.html"
      - "styles.css"
      - "app.js"
      - "clover.svg"
      - "lucky-logo.svg"
      - ".github/workflows/sync-wb.yml"

concurrency:
  group: lucky-wholesale-catalog
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate storefront
        run: |
          node scripts/build-storefront.mjs
          php tests/leads-domain.test.php
          node tests/leads-integration.cjs

      - name: Pull catalog from Wildberries
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/sync-wb.mjs
        env:
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}

      - name: Update KZT RUB USD exchange rates
        run: |
          node scripts/update-fx.mjs
          cp data/fx.json public/data/fx.json

      - name: Update WB popularity ranking
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/sync-popularity.mjs
        env:
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}

      - name: Build wholesale catalog
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/build-catalog.mjs

      - name: Cache product images locally
        run: node scripts/cache-product-images.mjs

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ public/data/ public/images/ index.html styles.css app.js clover.svg lucky-logo.svg version.txt
          cp -f public/index.html public/styles.css public/app.js public/clover.svg public/lucky-logo.svg public/version.txt ./
          mkdir -p images data
          cp -a public/images/. ./images/
          cp -a public/data/. ./data/
          git add index.html styles.css app.js clover.svg lucky-logo.svg version.txt images/ data/
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Build wholesale catalog"
            git pull --rebase -X theirs origin main
            git push origin main
          fi

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy photo studio rules to Plesk
        timeout-minutes: 4
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" <<'LFTP'
          set cmd:fail-exit true
          set ftp:passive-mode true
          set ftp:ssl-force false
          set ftp:ssl-protect-data false
          set ssl:verify-certificate false
          set net:max-retries 2
          set net:reconnect-interval-base 5
          set net:timeout 20
          put public/warehouse/studio-domain.php -o opt.luckysport.kz/warehouse/studio-domain.php
          get opt.luckysport.kz/warehouse/studio-domain.php -o /tmp/lucky-studio-studio-domain.php
          put public/warehouse/process-studio.php -o opt.luckysport.kz/warehouse/process-studio.php
          get opt.luckysport.kz/warehouse/process-studio.php -o /tmp/lucky-studio-process-studio.php
          put public/warehouse/studio-ui.js -o opt.luckysport.kz/warehouse/studio-ui.js
          get opt.luckysport.kz/warehouse/studio-ui.js -o /tmp/lucky-studio-studio-ui.js
          put public/warehouse/warehouse.js -o opt.luckysport.kz/warehouse/warehouse.js
          get opt.luckysport.kz/warehouse/warehouse.js -o /tmp/lucky-studio-warehouse.js
          put public/warehouse/index.html -o opt.luckysport.kz/warehouse/index.html
          get opt.luckysport.kz/warehouse/index.html -o /tmp/lucky-studio-index.html
          bye
          LFTP
          cmp public/warehouse/studio-domain.php /tmp/lucky-studio-studio-domain.php
          cmp public/warehouse/process-studio.php /tmp/lucky-studio-process-studio.php
          cmp public/warehouse/studio-ui.js /tmp/lucky-studio-studio-ui.js
          cmp public/warehouse/warehouse.js /tmp/lucky-studio-warehouse.js
          cmp public/warehouse/index.html /tmp/lucky-studio-index.html

      - name: Deploy and verify lead and SEO endpoints
        timeout-minutes: 4
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" <<'LFTP'
          set cmd:fail-exit true
          set ftp:passive-mode true
          set ftp:ssl-force false
          set ftp:ssl-protect-data false
          set ssl:verify-certificate false
          set net:max-retries 2
          set net:timeout 20
          mkdir -p opt.luckysport.kz/media
          put public/site-config.php -o opt.luckysport.kz/site-config.php
          get opt.luckysport.kz/site-config.php -o /tmp/lucky-leads-site-config-php
          put public/storefront-data.php -o opt.luckysport.kz/storefront-data.php
          get opt.luckysport.kz/storefront-data.php -o /tmp/lucky-leads-storefront-data-php
          put public/storefront-views.php -o opt.luckysport.kz/storefront-views.php
          get opt.luckysport.kz/storefront-views.php -o /tmp/lucky-leads-storefront-views-php
          put public/lead-domain.php -o opt.luckysport.kz/lead-domain.php
          get opt.luckysport.kz/lead-domain.php -o /tmp/lucky-leads-lead-domain-php
          put public/leads.php -o opt.luckysport.kz/leads.php
          get opt.luckysport.kz/leads.php -o /tmp/lucky-leads-leads-php
          put public/site-settings.php -o opt.luckysport.kz/site-settings.php
          get opt.luckysport.kz/site-settings.php -o /tmp/lucky-leads-site-settings-php
          put public/privacy.php -o opt.luckysport.kz/privacy.php
          get opt.luckysport.kz/privacy.php -o /tmp/lucky-leads-privacy-php
          put public/product.php -o opt.luckysport.kz/product.php
          get opt.luckysport.kz/product.php -o /tmp/lucky-leads-product-php
          put public/sitemap.php -o opt.luckysport.kz/sitemap.php
          get opt.luckysport.kz/sitemap.php -o /tmp/lucky-leads-sitemap-php
          put public/index.php -o opt.luckysport.kz/index.php
          get opt.luckysport.kz/index.php -o /tmp/lucky-leads-index-php
          put public/lead-phone.js -o opt.luckysport.kz/lead-phone.js
          get opt.luckysport.kz/lead-phone.js -o /tmp/lucky-leads-lead-phone-js
          put public/leads.js -o opt.luckysport.kz/leads.js
          get opt.luckysport.kz/leads.js -o /tmp/lucky-leads-leads-js
          put public/leads.css -o opt.luckysport.kz/leads.css
          get opt.luckysport.kz/leads.css -o /tmp/lucky-leads-leads-css
          put public/metrika.js -o opt.luckysport.kz/metrika.js
          get opt.luckysport.kz/metrika.js -o /tmp/lucky-leads-metrika-js
          put public/media/og-wholesale.png -o opt.luckysport.kz/media/og-wholesale.png
          get opt.luckysport.kz/media/og-wholesale.png -o /tmp/lucky-leads-media-og-wholesale-png
          put public/app.js -o opt.luckysport.kz/app.js
          get opt.luckysport.kz/app.js -o /tmp/lucky-leads-app-js
          put public/index.html -o opt.luckysport.kz/index.html
          get opt.luckysport.kz/index.html -o /tmp/lucky-leads-index-html
          put public/traffic-info.html -o opt.luckysport.kz/traffic-info.html
          get opt.luckysport.kz/traffic-info.html -o /tmp/lucky-leads-traffic-info-html
          put public/robots.txt -o opt.luckysport.kz/robots.txt
          get opt.luckysport.kz/robots.txt -o /tmp/lucky-leads-robots-txt
          put public/.htaccess -o opt.luckysport.kz/.htaccess
          get opt.luckysport.kz/.htaccess -o /tmp/lucky-leads--htaccess
          bye
          LFTP
          cmp public/site-config.php /tmp/lucky-leads-site-config-php
          cmp public/storefront-data.php /tmp/lucky-leads-storefront-data-php
          cmp public/storefront-views.php /tmp/lucky-leads-storefront-views-php
          cmp public/lead-domain.php /tmp/lucky-leads-lead-domain-php
          cmp public/leads.php /tmp/lucky-leads-leads-php
          cmp public/site-settings.php /tmp/lucky-leads-site-settings-php
          cmp public/privacy.php /tmp/lucky-leads-privacy-php
          cmp public/product.php /tmp/lucky-leads-product-php
          cmp public/sitemap.php /tmp/lucky-leads-sitemap-php
          cmp public/index.php /tmp/lucky-leads-index-php
          cmp public/lead-phone.js /tmp/lucky-leads-lead-phone-js
          cmp public/leads.js /tmp/lucky-leads-leads-js
          cmp public/leads.css /tmp/lucky-leads-leads-css
          cmp public/metrika.js /tmp/lucky-leads-metrika-js
          cmp public/media/og-wholesale.png /tmp/lucky-leads-media-og-wholesale-png
          cmp public/app.js /tmp/lucky-leads-app-js
          cmp public/index.html /tmp/lucky-leads-index-html
          cmp public/traffic-info.html /tmp/lucky-leads-traffic-info-html
          cmp public/robots.txt /tmp/lucky-leads-robots-txt
          cmp public/.htaccess /tmp/lucky-leads--htaccess

      - name: Deploy storefront to Plesk with lftp
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" <<'LFTP'
          set ftp:passive-mode true
          set ftp:ssl-force false
          set ftp:ssl-protect-data false
          set ssl:verify-certificate false
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set net:timeout 30
          mirror --reverse --only-newer --parallel=1 --verbose public/media/ opt.luckysport.kz/media/
          put public/data/selected-review-media.json -o opt.luckysport.kz/data/selected-review-media.json
          put public/warehouse/studio-domain.php -o opt.luckysport.kz/warehouse/studio-domain.php
          put public/warehouse/process-studio.php -o opt.luckysport.kz/warehouse/process-studio.php
          put public/warehouse/studio-ui.js -o opt.luckysport.kz/warehouse/studio-ui.js
          put public/data/catalog.json -o opt.luckysport.kz/data/catalog.json
          put public/warehouse/wb-pricing.php -o opt.luckysport.kz/warehouse/wb-pricing.php
          put public/warehouse/wb-existing.json -o opt.luckysport.kz/warehouse/wb-existing.json
          put public/warehouse/wb-prices.js -o opt.luckysport.kz/warehouse/wb-prices.js
          put public/wb-catalog.php -o opt.luckysport.kz/wb-catalog.php
          mirror --reverse --only-newer --parallel=1 --verbose public/ opt.luckysport.kz/
          bye
          LFTP

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload storefront
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy storefront
        id: deployment
        uses: actions/deploy-pages@v4

