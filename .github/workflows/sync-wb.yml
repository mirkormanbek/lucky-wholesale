name: Sync WB catalog

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/sync-wb.mjs"
      - ".github/workflows/sync-wb.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pull catalog from Wildberries
        run: node scripts/sync-wb.mjs
        env:
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}

      - name: Commit generated catalog data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No catalog changes"
          else
            git commit -m "Sync WB catalog data"
            git push
          fi
