name: Sync and build wholesale catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * 1-5"
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "config/**"
      - "catalog/**"
      - ".github/workflows/sync-wb.yml"

concurrency:
  group: lucky-wholesale-catalog
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pull catalog from Wildberries
        run: node scripts/sync-wb.mjs
        env:
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}

      - name: Update KZT RUB USD exchange rates
        run: node scripts/update-fx.mjs

      - name: Update WB popularity ranking
        run: node scripts/sync-popularity.mjs
        env:
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}

      - name: Build wholesale catalog
        run: node scripts/build-catalog.mjs

      - name: Cache product images locally
        run: node scripts/cache-product-images.mjs

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ public/data/ public/images/ index.html styles.css app.js clover.svg lucky-logo.svg version.txt
          cp -f public/index.html public/styles.css public/app.js public/clover.svg public/lucky-logo.svg public/version.txt ./
          rm -rf ./images ./data
          cp -a public/images ./images
          cp -a public/data ./data
          git add index.html styles.css app.js clover.svg lucky-logo.svg version.txt images/ data/
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Build wholesale catalog"
            git pull --rebase -X theirs origin main
            git push origin main
          fi

      - name: Deploy storefront to Plesk FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./public/
          server-dir: ./

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload storefront
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy storefront
        id: deployment
        uses: actions/deploy-pages@v4
