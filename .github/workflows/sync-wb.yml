name: Sync and build wholesale catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * 1-5"
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "config/**"
      - "catalog/**"
      - ".github/workflows/sync-wb.yml"

concurrency:
  group: lucky-wholesale-catalog
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pull catalog from Wildberries
        run: node scripts/sync-wb.mjs
        env:
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}

      - name: Update KZT RUB USD exchange rates
        run: node scripts/update-fx.mjs

      - name: Build wholesale catalog
        run: node scripts/build-catalog.mjs

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ public/data/
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Build wholesale catalog"
            git pull --rebase origin main
            git push origin main
          fi
